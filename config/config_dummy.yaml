# ============================================================
# config_dummy.yaml — Configuration for Local Smoke Testing
# ============================================================

# ── Paths ────────────────────────────────────────────────────
paths:
  # Local root
  base_dir:         "data/processed_dummy"

  # Synthetic Data paths generated by scripts/generate_dummy_data.py
  mimic_iv_dir:     "data/raw/mimic-iv-2.2"
  mimic_ecg_dir:    "data/raw/mimic-iv-ecg-1.0"
  mimic_cxr_dir:    "data/raw/mimic-cxr-jpg-2.0.0"

  # Outputs mapping
  cohort_dir:       "data/processed_dummy/data/cohort"
  processed_dir:    "data/processed_dummy/data/processed"
  models_dir:       "data/processed_dummy/outputs/models"
  results_dir:      "data/processed_dummy/outputs/results"
  figures_dir:      "data/processed_dummy/outputs/figures"
  logs_dir:         "data/processed_dummy/outputs/logs"

# ── Cohort ────────────────────────────────────────────────────
cohort:
  readmission_days: 30
  ecg_window_hours: 72
  cxr_window_hours: 72
  icd10_hf_prefix: "I50"
  icd9_hf_codes:
    - "4280"
    - "4281"
    - "42820"
    - "42821"
    - "42822"
    - "42823"
    - "42830"
    - "42831"
    - "42832"
    - "42833"
    - "42840"
    - "42841"
    - "42842"
    - "42843"
    - "4289"
  train_frac: 0.60
  val_frac:   0.20
  test_frac:  0.20
  random_seed: 42

# ── Tabular ───────────────────────────────────────────────────
tabular:
  lab_itemids:
    creatinine:   [50912]
    sodium:       [50983]
    hemoglobin:   [51222]
    bnp:          [51002]
  vital_itemids:
    heart_rate:       [220045]
    sbp:              [220179]
    temperature:      [223761]
  xgb:
    n_estimators:       5
    max_depth:          3
    learning_rate:      0.1
    subsample:          1.0
    colsample_bytree:   1.0
    eval_metric:        "aucpr"
    early_stopping:     2
    n_bootstrap:        3
    random_seed:        42

# ── ECG ───────────────────────────────────────────────────────
ecg:
  sample_rate:    500
  duration_sec:   10
  n_leads:        12
  target_len:     5000
  batch_size:     2
  epochs:         2
  lr:             1.0e-3
  weight_decay:   1.0e-4
  dropout:        0.1
  embed_dim:      256
  mc_passes:      5
  random_seed:    42

# ── CXR ───────────────────────────────────────────────────────
cxr:
  image_size:     224
  backbone:       "densenet121"
  pretrained:     false # skip downloading large imagenet weights for smoke test
  freeze_backbone: true
  embed_dim:      256
  batch_size:     2
  epochs:         2
  lr:             1.0e-3
  weight_decay:   1.0e-5
  dropout:        0.1
  mc_passes:      5
  random_seed:    42

# ── Fusion ────────────────────────────────────────────────────
fusion:
  d_fuse:         256
  dropout:        0.1
  gate_hidden:    16
  modality_drop_p: 0.3
  batch_size:     2
  epochs:         2
  lr:             1.0e-3
  weight_decay:   1.0e-4
  random_seed:    42

# ── Evaluation ────────────────────────────────────────────────
evaluation:
  ece_n_bins:     5
  dca_thresh_min: 0.0
  dca_thresh_max: 0.5
  dca_thresh_step: 0.05
  fairness_groups:
    - "gender"

# ── MLflow ────────────────────────────────────────────────────
mlflow:
  experiment_name: "dummy_smoke_test"
  tracking_uri:    "data/processed_dummy/outputs/mlflow"
